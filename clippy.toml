# Decision D8: all transcendental math goes through `sim_core::math::fmath` (libm),
# so native and WASM builds are bit-identical. std float intrinsics may lower to
# platform libm implementations that differ in the last ulp; mul_add (FMA) and
# powi are implementation-defined in rounding.
disallowed-methods = [
  { path = "f64::sin", reason = "use fmath::sin (libm) for determinism" },
  { path = "f64::cos", reason = "use fmath::cos (libm) for determinism" },
  { path = "f64::tan", reason = "use fmath::tan (libm) for determinism" },
  { path = "f64::sin_cos", reason = "use fmath::sin_cos (libm) for determinism" },
  { path = "f64::asin", reason = "use fmath::asin (libm) for determinism" },
  { path = "f64::acos", reason = "use fmath::acos (libm) for determinism" },
  { path = "f64::atan", reason = "use fmath::atan (libm) for determinism" },
  { path = "f64::atan2", reason = "use fmath::atan2 (libm) for determinism" },
  { path = "f64::sinh", reason = "use fmath (libm) for determinism" },
  { path = "f64::cosh", reason = "use fmath (libm) for determinism" },
  { path = "f64::tanh", reason = "use fmath (libm) for determinism" },
  { path = "f64::asinh", reason = "use fmath (libm) for determinism" },
  { path = "f64::acosh", reason = "use fmath (libm) for determinism" },
  { path = "f64::atanh", reason = "use fmath (libm) for determinism" },
  { path = "f64::exp", reason = "use fmath::exp (libm) for determinism" },
  { path = "f64::exp2", reason = "use fmath (libm) for determinism" },
  { path = "f64::exp_m1", reason = "use fmath (libm) for determinism" },
  { path = "f64::ln", reason = "use fmath::ln (libm) for determinism" },
  { path = "f64::ln_1p", reason = "use fmath (libm) for determinism" },
  { path = "f64::log", reason = "use fmath (libm) for determinism" },
  { path = "f64::log2", reason = "use fmath (libm) for determinism" },
  { path = "f64::log10", reason = "use fmath (libm) for determinism" },
  { path = "f64::powf", reason = "use fmath::pow (libm) for determinism" },
  { path = "f64::powi", reason = "powi rounding is implementation-defined; multiply explicitly" },
  { path = "f64::cbrt", reason = "use fmath::cbrt (libm) for determinism" },
  { path = "f64::hypot", reason = "use fmath::hypot (libm) for determinism" },
  { path = "f64::mul_add", reason = "FMA changes rounding; banned in the core (D8)" },
]
