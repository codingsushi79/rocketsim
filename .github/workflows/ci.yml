name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: Rust core (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The canary golden test also checks cross-architecture determinism:
      # this runner is x86_64 Linux, and the golden was produced on aarch64 macOS.
      - run: cargo test --workspace --release

  wasm-web:
    name: WASM build, native-vs-WASM canary, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (version pinned in Cargo.toml)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: ./scripts/build-wasm.sh
      - run: npm ci
        working-directory: web
      - name: Native and WASM canaries must be bit-identical
        run: |
          native=$(cargo run -q --release -p sim-cli -- canary)
          wasm=$(node web/scripts/canary.mjs)
          echo "native=$native wasm=$wasm"
          test "$native" = "$wasm"
      - name: Vehicle models match their JSON definitions
        run: |
          node tools/models/build_vehicle_glb.mjs data/vehicles/rs1_corvid.json web/public/models/rs1_corvid.glb
          git diff --exit-code -- web/public/models
      - name: Renderer unit tests (lens optics, incandescence)
        run: npm run test:unit
        working-directory: web
      - run: npm run build
        working-directory: web

  render-tests:
    name: Rendering tests (Playwright, headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (version pinned in Cargo.toml)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: ./scripts/build-wasm.sh
      - run: npm ci
        working-directory: web
      - name: Ephemeris fixture for the app (full decade files are not in git)
        run: npm run fixtures
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7
